// =============================================================================
// settings.gradle —— Gradle 的"项目设置"文件
// =============================================================================
// 在整个 Gradle 构建里，这个文件是"最先被读取"的那一个。当你在命令行敲下
// gradle 或者 gradlew 的时候，Gradle 会先读它，才知道这个目录里究竟有几
// 个项目（我们这里只有一个 rootProject），以及项目叫什么名字。
//
// 名字 rootProject.name 是很重要的：它决定了打出来的 jar 默认文件名、任务
// 分组名，还有各种输出目录里的项目命名。我们把它命名为 'systemwin'，这样
// Gradle 世界里这个工程的所有东西都统一带 systemwin 字样，一目了然。
// =============================================================================
rootProject.name = 'systemwin'

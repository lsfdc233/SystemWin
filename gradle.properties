# =============================================================================
# gradle.properties —— Gradle 的全局/项目级配置
# =============================================================================
# 这个文件里放的是一些"不用上命令行就能生效"的 Gradle 配置项，格式是标准的
# key=value 键值对。它们会在这个项目的任何一次 Gradle 构建中被自动读取。
# 我们把这三项都写得清清楚楚，这样即使换一台机器拉代码，构建行为也完全一致。
# =============================================================================

# org.gradle.jvmargs：给"运行 Gradle 本身"的那个 JVM 分配的内存参数。
# -Xmx1g 表示给它最多 1GB 堆内存。一般项目 1GB 够用，也能避免默认值在某些
# 机器上过大或过小，构建更稳定、可预期。
org.gradle.jvmargs=-Xmx1g

# org.gradle.daemon：是否开启 Gradle 守护进程（后台常驻的 JVM，用来复用、
# 加速多次构建）。开为 true 后，第一次构建慢一点，之后重复构建明显变快，
# 因为不用每次白白冷启动一个 JVM。这是我们希望的行为，所以设为 true。
org.gradle.daemon=true

# org.gradle.console：控制台输出风格。
# plain 表示"纯文本、简洁"模式，不输出花哨的彩色进度条和动画。在 Windows
# 命令行/cmd 里这种干净输出最友好，也方便脚本程序去解析构建日志。
org.gradle.console=plain
